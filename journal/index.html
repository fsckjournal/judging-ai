/* Judging AI · the tokens, the faces and the header come from ../ds.css (design system « Juger l'IA » V3); this page keeps only its own layout. */

*{box-sizing:border-box}
html,body{margin:0;background:var(--fond);color:var(--encre);font:400 17px/1.5 var(--sans)}

/* l'en-tête d'une page : étiquette mono à gauche, boîte O·R·I·X à droite, filet orange */
.top{position:relative;height:2px;background:var(--orange);margin-top:2.6em}
.top .k{position:absolute;left:0;top:-2.0em;color:var(--sourd);font:500 15px/1 var(--mono);letter-spacing:.08em;padding:.5em 0}
.top .tag{position:absolute;right:0;top:-2.05em;background:var(--orange);color:var(--sur-orange);font:700 14px/1 var(--serif);letter-spacing:.28em;padding:.55em .8em .55em 1em;white-space:nowrap}

/* les voix */
.big{font:400 clamp(30px,8vw,56px)/1.15 var(--serif);margin:0}
.med{font:400 clamp(22px,5.4vw,34px)/1.3 var(--serif);margin:0}
.l{font:400 clamp(17px,4.2vw,22px)/1.45 var(--sans);margin:0;color:var(--encre)}
.q{font:italic 400 clamp(20px,5vw,30px)/1.3 var(--serif);margin:0}
.s{font:400 14px/1.4 var(--sans);color:var(--sourd);margin:0}
.m{font:400 14px/1.5 var(--mono);margin:0;padding:.35em .7em;border-left:2px solid var(--orange);background:var(--boite);white-space:pre-wrap;word-break:break-word}

/* une ligne : la lettre en mono orange, le texte */
.ln{display:grid;grid-template-columns:1.6em 1fr;gap:.7em;margin:0 0 .6em;word-break:break-word}
.ln .meta{color:var(--orange);font:500 14px/1.9 var(--mono)}
.ln .txt{font:400 clamp(17px,4.2vw,22px)/1.45 var(--sans)}
.ln .txt b{font-weight:700}

/* la lettre dans le texte */
.chip{display:inline-block;min-width:1.55em;text-align:center;font:600 .95em/1.5 var(--serif);border:2px solid var(--encre);border-radius:6px;padding:0 .3em;vertical-align:baseline}
.chip.x{border-color:var(--orange);color:var(--orange)}

hr.r{border:0;border-top:1px solid var(--trait);margin:.6em 0;width:100%}
.draw{width:min(46vw,220px);height:auto}
.help{color:var(--sourd);font:400 12px/1.5 var(--mono);opacity:.7}

button,input,textarea{font-size:16px;color:inherit;-webkit-tap-highlight-color:transparent}

<script>/* Judging AI · analyse d'une réponse collée.
   Découpe une réponse de modèle en affirmations et y repère ce qui se vérifie : références,
   dates, chiffres précis, réserves, « vérifié » dit par le modèle, offres. Interroge ensuite
   les registres publics (jamais un modèle). Ne décide ni du statut ni du verdict. */
var ANALYSE = (function () {
  "use strict";

  var ABBR = /(?:^|[\s(])(?:p|pp|n°|no|vol|éd|ed|eds|dir|coll|cf|env|av|apr|J\.-C|M|Mme|Mlle|Dr|St|Ste|Mt|et al|fig|ch|chap|op|cit|ibid|vs|etc|i\.e|e\.g|sept|oct|nov|déc|janv|févr|avr|juil|Jr|Sr|Inc|Ltd|Co|av\. J\.-C)\.$/i;

    /pas (?:certain|sûr)/i, /probablement/i, /vraisemblabl/i, /plausible/i, /de seconde main/i, /de mémoire/i,
    /non garanti/i, /à confirmer/i, /incertain/i, /il semble/i, /aurait été/i, /serait\b/i,
    /not verified/i, /unverified/i, /\bcould ?n[o']t (?:verify|confirm|access)/i, /\bcannot (?:verify|confirm)/i,
    /\bprobably\b/i, /\blikely\b/i, /second-hand/i, /from memory/i, /not guaranteed/i, /\bunclear\b/i, /\bappears to\b/i,

    /\bvérifi(?:é|ée|és|ées)\b/i, /j'ai (?:vérifié|consulté|confirmé)/i, /\bje confirme\b/i, /réellement consulté/i,
    /\bverified\b/i, /\bi (?:have )?(?:checked|confirmed|consulted)\b/i, /\bconfirmed\b/i

  var NEGSELF = /(?:\bpas\b|\bnon\b|\bnot\b|n't\b|\bnever\b|\bjamais\b)\W+(?:\w+\W+){0,2}(?:vérifi|verif|confirm|consult)/i;

  var SELFTALK = /^(?:je |j'|voici|voilà|laisse-moi|honnêtement|par honnêteté|i |i'm |i've |here (?:is|are)|let me|to be honest)/i;

  var RX = {
    md: /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    url: /https?:\/\/[^\s)\]>»"'<]+/g,
    doi: /\b10\.\d{4,9}\/[^\s"'<>»)\]]+/gi,
    arxiv: /\barXiv[:\s]*(\d{4}\.\d{4,5})(?:v\d+)?/gi,
    isbn: /\bISBN(?:-1[03])?[:\s]*((?:97[89][\s-]?)?(?:\d[\s-]?){9}[\dXx])/gi,
    year: /\b(1[5-9]\d\d|20\d\d)\b/g,
    page: /\bpp?\.\s?\d+(?:\s?[-–]\s?\d+)?/gi,
    num: /\b\d{1,3}(?:[  .,]\d{3})*(?:[.,]\d+)?\s?(?:%|‰|m²|m2|m³|km²|km|cm|mm|m\b|ha\b|kg|t\b|W\b|kW|MW|kWh|€|\$|USD|LBP|£|étages?|floors?|storeys?|niveaux?|chambres?|rooms?|places?|mètres|meters|metres|ans\b|years?\b)/gi,
    dim: /\b\d+(?:[.,]\d+)?\s?[×x]\s?\d+(?:[.,]\d+)?(?:\s?m)?\b/g,

    return line
      .replace(RX.md, function (_, t, u) { return t + " (" + u + ")"; })
      .replace(/\*\*([^*]+)\*\*/g, "$1").replace(/__([^_]+)__/g, "$1")
      .replace(/^\s{0,3}#{1,6}\s+/, "")

    for (var i = 0; i < line.length; i++) {

    if (/^\s*\[/.test(j)) {
      try { var d = JSON.parse(j); if (Array.isArray(d)) { d.forEach(function (x) { if (x && typeof x === "object") recs.push({ affirmation: String(x.affirmation || x.claim || ""), reference: String(x.reference || x.référence || ""), reste: String(x.non_verifie || x.non_vérifié || x.unverified || "") }); }); return recs.length ? { format: "json", recs: recs, extra: 0 } : null; } } catch (e) {}
    }

    if (num.length && num.length >= ls.length - 2) {
      return { format: "numéros", recs: num.map(function (m) { return { affirmation: m[1].replace(/^\[|\]$/g, ""), reference: m[2].replace(/^\[|\]$/g, ""), reste: m[3].replace(/^\[|\]$/g, "") }; }), extra: ls.length - num.length };

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}

function blank(){return {schema:SCHEMA,lieu:{nom:"",adresse:"",note:""},lignes:[],enquetes:[],banc:blankBanc()};}
function blankBanc(){return {prompts:[],versions:[{id:"sans",nom:"",skill:"",cree:now()}],essais:{},conditions:{attendu:"",modele:"",date:"",web:"",ordre:""}};}
function newLigne(src){return {id:uid(),cree:now(),date:new Date().toISOString().slice(0,10),affirmation:"",statut:"",operation:"",resultat:"",reste:"",ms:0,depuis:null,enquete:src||""};}
function newEnq(){return {id:uid(),cree:now(),titre:"",modele:"",tours:[],promptUnique:"",reponseUnique:"",meme:""};}
function clean(d){
  var o=blank(); if(!d||typeof d!=="object")return o;
  var l=d.lieu||{}; o.lieu={nom:S(l.nom),adresse:S(l.adresse),note:S(l.note)};
  o.lignes=(Array.isArray(d.lignes)?d.lignes:[]).map(function(x){x=x||{};var b=newLigne();
    ["id","cree","date","affirmation","statut","operation","resultat","reste","enquete"].forEach(function(k){if(S(x[k]))b[k]=S(x[k]);});
    b.ms=N(x.ms);b.depuis=typeof x.depuis==="number"?x.depuis:null;return b;});
  var bc=d.banc||{}; o.banc=blankBanc();
  o.banc.prompts=(Array.isArray(bc.prompts)?bc.prompts:[]).map(function(x){x=x||{};return {id:S(x.id)||uid(),texte:S(x.texte)};});
  var vs=(Array.isArray(bc.versions)?bc.versions:[]).map(function(x){x=x||{};return {id:S(x.id)||uid(),nom:S(x.nom),skill:S(x.skill),cree:S(x.cree)||now()};});
  if(!vs.some(function(v){return v.id==="sans";}))vs.unshift({id:"sans",nom:"",skill:"",cree:now()});
  o.banc.versions=vs;
  var cd=bc.conditions||{}; o.banc.conditions={attendu:S(cd.attendu),modele:S(cd.modele),date:S(cd.date),web:S(cd.web),ordre:S(cd.ordre)};
  var es=bc.essais&&typeof bc.essais==="object"?bc.essais:{};
  Object.keys(es).forEach(function(k){var x=es[k]||{};var le=x.lecture&&typeof x.lecture==="object"?x.lecture:{};o.banc.essais[k]={reponse:S(x.reponse),cree:S(x.cree)||now(),registres:x.registres&&typeof x.registres==="object"?x.registres:{},lecture:{etaye:S(le.etaye),contredit:S(le.contredit),nonres:S(le.nonres),utilisable:S(le.utilisable),minutes:S(le.minutes)}};});
  o.enquetes=(Array.isArray(d.enquetes)?d.enquetes:[]).map(function(x){x=x||{};var b=newEnq();
    ["id","cree","titre","modele","promptUnique","reponseUnique","meme"].forEach(function(k){if(S(x[k]))b[k]=S(x[k]);});
    b.tours=(Array.isArray(x.tours)?x.tours:[]).map(function(y){y=y||{};function obj(o){return o&&typeof o==="object"&&!Array.isArray(o)?o:{};}
    return {id:S(y.id)||uid(),cree:S(y.cree)||now(),geste:typeof y.geste==="number"?y.geste:-1,prompt:S(y.prompt),reponse:S(y.reponse),registres:obj(y.registres),lettres:obj(y.lettres),envoyes:obj(y.envoyes),suggestion:Array.isArray(y.suggestion)?y.suggestion.map(function(s){s=s||{};return {label:S(s.label),prompt:S(s.prompt)};}):null};});
    return b;});
  return o;
}

    app.appendChild(h("div",{class:"ln"},[h("span",{class:"meta",text:L.l}),h("span",{class:"txt"},[h("b",{text:L.nom}),document.createTextNode(" · "+x.def+"."),h("div",{class:"s",text:x.question+" · "+x.piege})])]));});
  app.appendChild(h("p",{class:"l",text:fill(CARTE.titre[lang]).replace(/^O·R·I·X ?: ?/,"")}));
  app.appendChild(top(t("rules")));
  CARTE.regles[lang].forEach(function(r){app.appendChild(h("p",{class:"med",text:fill(r).split(". ")[0]}));app.appendChild(h("p",{class:"s",text:fill(r).split(". ").slice(1).join(". ")}));});
  app.appendChild(h("p",{class:"help",text:((CARTE.actions_i18n&&CARTE.actions_i18n[lang])||CARTE.actions).join(" · ")}));
}

function vGarder(){
  app.appendChild(top(t("garder")));
  app.appendChild(h("p",{class:"s",text:t("gIntro")}));
  app.appendChild(h("div",{class:"row"},[
    h("button",{class:"act",text:t("exJson"),on:{click:function(){share(JSON.stringify(data,null,2),fname()+".json","application/json");}}}),
    h("button",{class:"txtbtn",text:t("exMd"),on:{click:function(){share(md(),fname()+".md","text/markdown");}}})].concat(PLUS?[
    h("button",{class:"txtbtn",text:t("copy"),on:{click:function(){copy(md());}}})]:[]).concat([
    h("button",{class:"txtbtn",text:t("imp"),on:{click:function(){document.getElementById("fileIn").click();}}})])));
  app.appendChild(top(t("lieu")));
  app.appendChild(h("p",{class:"s",text:t("lieuHint")}));
  app.appendChild(fld(t("name"),"text",data.lieu.nom,function(v){data.lieu.nom=v;},{class:"voix"}));
  app.appendChild(fld(t("addr"),"text",data.lieu.adresse,function(v){data.lieu.adresse=v;},{class:"voix"}));
  app.appendChild(fld(t("why"),"textarea",data.lieu.note,function(v){data.lieu.note=v;},{class:"voix"}));
  if(PLUS)app.appendChild(h("pre",{class:"out",text:md()}));
}
function fname(){return "judging-ai-"+(data.lieu.nom||"journal").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\w-]+/g,"-").replace(/^-|-$/g,"").slice(0,40)+"-"+new Date().toISOString().slice(0,10);}
function fence(s){s=s||"";var f="```";while(s.indexOf(f)>=0)f+="`";return f+"\n"+s+"\n"+f;}
function md(){
  var L=["# "+(data.lieu.nom||t("lieu")),""]; if(data.lieu.adresse)L.push(data.lieu.adresse,""); if(data.lieu.note)L.push(data.lieu.note,"");
  function cell(s){return String(s||"").replace(/\|/g,"\\|").replace(/\r?\n/g," ");}
  L.push("## "+t("journal"),"","| "+[t("date"),t("aff"),cat(true),t("op"),t("res"),t("rest"),t("time")].join(" | ")+" |","|---|---|---|---|---|---|---|");
  data.lignes.forEach(function(l){L.push("| "+[l.date,l.affirmation,l.statut,l.operation,l.resultat?t("R")[l.resultat]:"",l.reste,fmt(msOf(l))].map(cell).join(" | ")+" |");});
  data.enquetes.forEach(function(e){
    L.push("","## "+t("model")+" · "+(e.titre||"…"),"",t("modelName")+t("col")+(e.modele||"—"),"");
    e.tours.forEach(function(x,i){L.push("### "+t("turn")+" "+(i+1)+(x.geste>=0?" · "+t("G")[x.geste]:""),"",fence(x.prompt),"",fence(x.reponse),"");});
    if(e.promptUnique)L.push("### "+t("single"),"",fence(e.promptUnique),"",fence(e.reponseUnique),"");
  });
  var B=data.banc;
  if(B){
    var Cn=B.conditions||{};
    L.push("","## "+t("banc"),"",t("attendu")+t("col")+(Cn.attendu||"—"),"",
      t("condModel")+t("col")+(Cn.modele||"—")+" · "+t("condDate")+t("col")+(Cn.date||"—")+" · "+t("condWeb")+t("col")+(t("web")[Cn.web]||"—")+" · "+t("condOrder")+t("col")+(t("order")[Cn.ordre]||"—"),"");
    if(!B.prompts.length)L.push(t("noTests"),"");
    else{
      var head=[""].concat(B.versions.map(function(v,i){return vname(v,i);}));
      L.push("| "+head.join(" | ")+" |","|"+head.map(function(){return "---";}).join("|")+"|");
      var lc=B.versions.map(function(v){return lecture(v.id);});Object.keys(t("LE")).forEach(function(k){L.push("| "+[t("LE")[k]].concat(lc.map(function(m){return m[k];})).join(" | ")+" |");});
      var ms=B.versions.map(function(v){return metrics(v.id);});
      Object.keys(t("M")).forEach(function(k){L.push("| "+[t("M")[k]].concat(ms.map(function(m){return String(m[k]);})).join(" | ")+" |");});
      B.versions.forEach(function(v,i){if(v.id!=="sans")L.push("","### "+vname(v,i)+" · "+v.cree.slice(0,10),"",fence(v.skill));});
      B.prompts.forEach(function(pr,pi){L.push("","### #"+(pi+1),"",fence(pr.texte));B.versions.forEach(function(v,i){var es=B.essais[pr.id+"|"+v.id];if(es&&es.reponse.trim())L.push("","**"+vname(v,i)+"**","",fence(es.reponse));});});
    }
  }
  return L.join("\n");
}
function markExport(){try{localStorage.setItem(KEY+"-export",String(Date.now()));}catch(e){}}
function share(text,name,type){
  try{if(navigator.canShare&&typeof File==="function"){var f=new File([text],name,{type:type});
    if(navigator.canShare({files:[f]})){navigator.share({files:[f],title:name}).then(markExport).catch(function(err){if(!err||err.name!=="AbortError")dl(text,name,type);});return;}}}catch(e){}
  dl(text,name,type);
}
function dl(text,name,type){try{var u=URL.createObjectURL(new Blob([text],{type:type+";charset=utf-8"})),a=h("a",{href:u,download:name});document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove();},2000);markExport();}catch(e){copy(text);}}
function copy(text){function fb(){var x=h("textarea",{style:"position:fixed;top:0;opacity:0"});x.value=text;document.body.appendChild(x);x.select();try{document.execCommand("copy");toast(t("copied"));}catch(e){}x.remove();}
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(function(){toast(t("copied"));},fb);else fb();}
document.getElementById("fileIn").addEventListener("change",function(ev){
  var f=ev.target.files&&ev.target.files[0];ev.target.value="";if(!f)return;var r=new FileReader();
  r.onload=function(){var inc;try{inc=clean(JSON.parse(r.result));}catch(e){toast(t("bad"));return;}
    var have={};data.lignes.concat(data.enquetes).forEach(function(x){have[x.id]=1;});var a=0,b=0;
    inc.lignes.forEach(function(x){if(!have[x.id]){data.lignes.push(x);a++;}});inc.enquetes.forEach(function(x){if(!have[x.id]){data.enquetes.push(x);b++;}});
    if(!data.lieu.nom&&inc.lieu.nom)data.lieu=inc.lieu;
    if(!data.banc.prompts.length&&inc.banc.prompts.length)data.banc=inc.banc;save();render();toast(t("imported").replace("{a}",pl(a,"lines")).replace("{b}",pl(b,"enqs")));};
  r.readAsText(f);
});

var theme=""; try{theme=localStorage.getItem(KEY+"-theme")||"";}catch(e){}
function applyTheme(){if(theme)document.documentElement.setAttribute("data-theme",theme);else document.documentElement.removeAttribute("data-theme");}
applyTheme();

  var dark=theme?theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  theme=dark?"light":"dark";applyTheme();try{localStorage.setItem(KEY+"-theme",theme);}catch(e){}});
window.addEventListener("hashchange",function(){var q=location.hash.slice(1).split(":");if(["plan","journal","model","banc","carte","garder"].indexOf(q[0])>=0){go(q[0],q[1]);}});
document.getElementById("lang").addEventListener("click",function(){lang=lang==="fr"?"en":"fr";try{localStorage.setItem(KEY+"-lang",lang);}catch(e){}render();});

load();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
(function(){
  if(!ok)return;
  var standalone=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
  var ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  var last=0;try{last=Number(localStorage.getItem(KEY+"-export"))||0;}catch(e){}
  if(ios&&!standalone)banner(t("ios"));else if(data.lignes.length&&Date.now()-last>6*864e5)banner(t("old"));
})();
render();
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){navigator.serviceWorker.register("../sw.js").catch(function(){});}
})();
