<style>
/* Judging AI · the tokens, the faces and the header come from ../ds.css (design system « Juger l'IA » V3); this page keeps only its own layout. */

*{box-sizing:border-box}
html,body{margin:0;background:var(--fond);color:var(--encre);font:400 17px/1.5 var(--sans)}

/* l'en-tête d'une page : étiquette mono à gauche, boîte O·R·I·X à droite, filet orange */
.top{position:relative;height:2px;background:var(--orange);margin-top:2.6em}
.top .k{position:absolute;left:0;top:-2.0em;color:var(--sourd);font:500 15px/1 var(--mono);letter-spacing:.08em;padding:.5em 0}
.top .tag{position:absolute;right:0;top:-2.05em;background:var(--orange);color:var(--sur-orange);font:700 14px/1 var(--serif);letter-spacing:.28em;padding:.55em .8em .55em 1em;white-space:nowrap}

/* les voix */
.big{font:400 clamp(30px,8vw,56px)/1.15 var(--serif);margin:0}
.med{font:400 clamp(22px,5.4vw,34px)/1.3 var(--serif);margin:0}
.l{font:400 clamp(17px,4.2vw,22px)/1.45 var(--sans);margin:0;color:var(--encre)}
.q{font:italic 400 clamp(20px,5vw,30px)/1.3 var(--serif);margin:0}
.s{font:400 14px/1.4 var(--sans);color:var(--sourd);margin:0}
.m{font:400 14px/1.5 var(--mono);margin:0;padding:.35em .7em;border-left:2px solid var(--orange);background:var(--boite);white-space:pre-wrap;word-break:break-word}

/* une ligne : la lettre en mono orange, le texte */
.ln{display:grid;grid-template-columns:1.6em 1fr;gap:.7em;margin:0 0 .6em;word-break:break-word}
.ln .meta{color:var(--orange);font:500 14px/1.9 var(--mono)}
.ln .txt{font:400 clamp(17px,4.2vw,22px)/1.45 var(--sans)}
.ln .txt b{font-weight:700}

/* la lettre dans le texte */
.chip{display:inline-block;min-width:1.55em;text-align:center;font:600 .95em/1.5 var(--serif);border:2px solid var(--encre);border-radius:6px;padding:0 .3em;vertical-align:baseline}
.chip.x{border-color:var(--orange);color:var(--orange)}

hr.r{border:0;border-top:1px solid var(--trait);margin:.6em 0;width:100%}
.draw{width:min(46vw,220px);height:auto}
.help{color:var(--sourd);font:400 12px/1.5 var(--mono);opacity:.7}

/* on the design system: the band holds the header and the one heading; below it, ink on paper, ink rules, no boxes */
main{display:flex;flex-direction:column;gap:.9em}
/* the rules span the band's grid; the text keeps its measure */
.cl{max-width:36em}.why,.verdict{max-width:46em}
.sec{display:flex;flex-direction:column;gap:.8em;padding-top:0}
.sec:first-child{padding-top:32px}
.cl{font:500 clamp(19px,2.4vw,23px)/1.4 var(--sans);letter-spacing:-.01em;margin:.2em 0 0}
.part{border-top:1px solid var(--encre);padding:14px 0 .2em;margin:.6em 0 0;display:flex;flex-direction:column;gap:.6em}
.letters button{width:56px;height:56px}
.verdict{font:500 17px/1.5 var(--sans);margin:0;color:var(--encre)}
.verdict.no{font-weight:600}
.why{font:400 17px/1.5 var(--sans);color:var(--encre2);margin:0}
details.piece{border-top:1px solid var(--encre);padding:2px 0}
details.piece>summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;font:500 16px/1.4 var(--sans);color:var(--encre);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;padding:.3em 0}
details.piece>summary::-webkit-details-marker{display:none}
.act{align-self:flex-start}
.lnk{align-self:flex-start}
.score{margin:0}
.score span{font-weight:400;color:var(--encre2)}
.intro{margin:0}
</style>

<script id="carte" type="application/json">{"categorie": {"fr": "statut", "en": "standing"}, "titre": {"fr": "O·R·I·X : le {categorie} d'une affirmation, jamais sa vérité", "en": "O·R·I·X: the {categorie} of a claim, never its truth"}, "lettres": [{"l": "O", "nom": "Observation", "fr": {"def": "un constat : quelqu'un l'a vu, mesuré ou compté, et dit quand", "question": "qui l'a constaté, à quelle date ?", "piege": "une phrase peut imiter la forme d'un relevé sans relevé ; le relevé d'un autre, recopié, est une source (R)"}, "en": {"def": "an observation: someone saw, measured or counted it, and says when", "question": "who observed it, on what date?", "piege": "a sentence can imitate the form of a survey without a survey; someone else's survey, copied, is a source (R)"}}, {"l": "R", "nom": "Retrieval", "fr": {"def": "une source nommée, ouverte, qui dit cela", "question": "quelle source, et dit-elle cela ?", "piege": "la source existe mais ne dit pas cela, le mal attribué : ce n'est plus R ; I si elle en dit une partie et que la phrase fait le pas, X si elle n'en dit rien"}, "en": {"def": "a named source, opened, that says it", "question": "which source, and does it say that?", "piege": "the source exists but does not say that, the misattributed: it is no longer R; I if it says part of it and the sentence takes the step, X if it says nothing of it"}}, {"l": "I", "nom": "Inference", "fr": {"def": "des prémisses (O ou R) et un pas qu'elles ne font pas elles-mêmes, dit ou non", "question": "depuis quelles prémisses ?", "piege": "l'inférence qui ne se dit pas : elle prend l'air d'un O ou d'un R"}, "en": {"def": "premises (O or R) and a step they do not take themselves, said or not", "question": "from which premises?", "piege": "the inference that does not say so: it looks like an O or an R"}}, {"l": "X", "nom": "Invention", "fr": {"def": "la forme d'un fait ; rien de ce qu'elle avance ne la porte", "question": "qu'est-ce qui le porte ? rien", "piege": "une invention peut être vraie par hasard ; elle reste une invention"}, "en": {"def": "the form of a fact; nothing it puts forward carries it", "question": "what carries it? nothing", "piege": "an invention can be true by chance; it remains an invention"}}], "regles": {"fr": ["Une seule question : qu'est-ce qui porte cette affirmation, telle qu'elle a été faite ? O, R, I et X en sont les quatre réponses, données une fois le lien vérifié. Avant, « à vérifier » n'est pas une lettre.", "{Categorie} ≠ vérité. Une affirmation vraie peut être une invention ; une fausse peut être un retrieval correct d'une source qui se trompe.", "Ce qu'on trouve après coup porte une autre affirmation : la nôtre, avec sa propre lettre.", "Un modèle constate ce qu'il a sous les yeux : une page, un plan, un calcul. Le bâtiment, jamais : ce qu'il en dit passe par R ou par I.", "Scinder les clauses composées. « Érigé en 1932, l'un des mieux conservés » = deux affirmations.", "Une absence est une affirmation sur l'espace cherché. « Introuvable » s'écrit avec ce qui a été cherché, ou ne s'écrit pas."], "en": ["One question: what carries this claim, as it was made? O, R, I and X are its four answers, given once the link is checked. Before that, “to be checked” is not a letter.", "{Categorie} ≠ truth. A true claim can be an invention; a false one can be a correct retrieval from a source that is wrong.", "What we find afterwards carries another claim: ours, with its own letter.", "A model observes what is in front of it: a page, a drawing, a calculation. Never the building: what it says about the building goes through R or I.", "Split compound clauses. “Built in 1932, one of the best preserved” = two claims.", "An absence is a claim about the space searched. “Not found” is written with what was searched, or not written at all."]}, "actions": ["Classify", "Verify", "Bound", "Decide and defend"], "cours": {"fr": "Juger l'IA : preuves et autorité", "en": "Judging AI: Evidence and Authority"}, "actions_i18n": {"fr": ["Classer", "Vérifier", "Borner", "Décider et défendre"], "en": ["Classify", "Verify", "Bound", "Decide and defend"]}}</script>

<script>
(function(){
"use strict";
var lang="fr";try{lang=localStorage.getItem("judging-ai-journal-lang")==="en"?"en":"fr";}catch(e){}
var theme="";try{theme=localStorage.getItem("judging-ai-journal-theme")||"";}catch(e){}
function applyTheme(){if(theme)document.documentElement.setAttribute("data-theme",theme);else document.documentElement.removeAttribute("data-theme");}

var PIECES=[
 ["B-1","Relevé de terrain · agence, 12 mai 2026","« Façade nord : fissure verticale continue du premier au deuxième étage ; ouverture mesurée au droit du linteau du deuxième étage : 14 mm. Trois travées régulières ; balcons en pierre aux niveaux 1 et 2. Rez-de-chaussée commercial muré à la date du relevé. »"],
 ["B-2","Fiche cadastrale · copie","« Parcelle 214, rue du Levant. Permis de construire enregistré en 1932. Architecte : non mentionné. Surélévation d'un étage autorisée en 1956. »"],
 ["B-3","Règlement de zone · extrait","« Art. 7. Toute intervention sur une façade en pierre de taille située en zone ancienne requiert un avis préalable de la commission compétente. »"],
 ["B-4","Photographie datée · cliché de l'agence, 12 mai 2026","« Vue générale depuis la rue : la corniche du dernier niveau diffère nettement, par son profil et son matériau, de celle des niveaux inférieurs. Menuiseries récentes au dernier niveau. »"]
];

var CLAUSES=[
 {n:"clause 1",parts:[
   {t:"L'immeuble Ayoub, érigé en 1932,",ok:["I"],src:["B-2"],
    fr:"B-2 enregistre un permis de construire en 1932. Un permis n'est pas une construction : « érigé en 1932 » est déduit de la fiche, sans le dire, et peut être faux — bâti en 1934, ou jamais.",
    en:"B-2 records a building permit in 1932. A permit is not a building: “érigé en 1932” is deduced from the sheet, without saying so, and it can be false — built in 1934, or never."},
   {t:"est l'un des exemples les mieux conservés de l'architecture des années trente du quartier.",ok:["X"],src:[],
    fr:"Aucun corpus, aucune comparaison dans le Document B. La forme d'un jugement, rien derrière.",
    en:"No corpus, no comparison anywhere in Document B. The shape of a judgement, nothing behind it."}]},
 {n:"clause 3",parts:[
   {t:"Cette ouverture dépassant le seuil d'alerte de 10 mm fixé par les normes en vigueur,",ok:["X"],src:["B-1"],
    fr:"B-1 donne bien 14 mm. Le seuil de 10 mm, lui, n'est nulle part dans B : la norme est fabriquée. Le nombre vrai à côté du seuil inventé, c'est ce qui rend la phrase crédible.",
    en:"B-1 does give 14 mm. The 10 mm threshold is nowhere in B: the standard is fabricated. A true figure next to an invented threshold is what makes the sentence credible."},
   {t:"la structure est en péril imminent et une consolidation doit intervenir sous 90 jours.",ok:["X"],src:[],
    fr:"Rien dans B ne porte le péril ni les 90 jours. Une urgence a un auteur : demandez qui la déclare.",
    en:"Nothing in B carries the danger or the 90 days. An emergency has an author: ask who declares it."}]},
 {n:"clause 8",parts:[
   {t:"Aucun document d'archive ne mentionne l'architecte d'origine.",ok:["X","I"],src:["B-2"],
    fr:"Telle quelle, la phrase porte sur toutes les archives, et rien ne la porte. L'absence n'est établie que pour B-2 (« architecte : non mentionné »). Bornée — « la fiche cadastrale fournie ne mentionne pas d'architecte » — elle devient R. Une absence s'écrit avec ce qui a été cherché, ou ne s'écrit pas.",
    en:"As written, the sentence is about all archives, and nothing carries it. The absence is established for B-2 only (“architecte : non mentionné”). Bounded — “the cadastral sheet provided does not name an architect” — it becomes R. An absence is written with what was searched, or not written at all."}]}
];

var T={fr:{titre:"s'entraîner",sous:"Trois clauses de la note Ayoub, comme en séance 1. Une lettre par morceau. Les pièces sont là : les ouvrir avant de répondre, c'est le geste.",
 pieces:"les pièces · Document B",piecesAide:"Dans le monde de l'exercice, ces quatre pièces sont tout ce qui existe.",
 votre:"la lettre choisie",juste:"juste",presque:"défendable",faux:"la lettre attendue :",porte:"la pièce en jeu :",aucune:"aucune pièce ne la porte",
 score:"score",sur:"sur 5 morceaux",rejouer:"recommencer",retour:"← la page du cours",carte:"la carte O·R·I·X",
 fin:"Le statut, pas la vérité. Une phrase vraie peut être une invention ; une phrase fausse peut être un retrieval correct d'une source qui se trompe."},
 en:{titre:"practice",sous:"Three clauses from the Ayoub note, as in session 1. One letter per part. The sources are here: opening them before answering is the move.",
 pieces:"the sources · Document B",piecesAide:"In the world of the exercise, these four pieces are all that exists. The documents stay in French.",
 votre:"the chosen letter",juste:"right",presque:"defensible",faux:"the expected letter:",porte:"the piece at stake:",aucune:"no piece carries it",
 score:"score",sur:"out of 5 parts",rejouer:"start again",retour:"← the course page",carte:"the O·R·I·X card",
 fin:"The standing, not the truth. A true sentence can be an invention; a false one can be a correct retrieval from a source that is wrong."}};

var answers={};
function h(tag,a,kids){var e=document.createElement(tag);if(a)for(var k in a){var v=a[k];if(k==="text")e.textContent=v;else if(k==="on")for(var ev in v)e.addEventListener(ev,v[ev]);else if(v!=null&&v!==false)e.setAttribute(k,v);}(kids||[]).forEach(function(c){if(c!=null)e.appendChild(typeof c==="string"?document.createTextNode(c):c);});return e;}
function top(l){return h("div",{class:"top"},[h("span",{class:"k",text:l})]);}
function pieceBox(id){var p=PIECES.filter(function(x){return x[0]===id;})[0];if(!p)return null;
 return h("details",{class:"piece"},[h("summary",{text:p[0]+" · "+p[1]}),h("p",{class:"m",text:p[2]})]);}

function render(){
 var t=T[lang],app=document.getElementById("app");app.innerHTML="";document.documentElement.lang=lang;
 var lb=document.getElementById("lang");lb.innerHTML=lang==="fr"?"<b>fr</b> · en":"fr · <b>en</b>";
 document.getElementById("bande-titre").textContent=t.titre;
 var s=h("section",{class:"sec"},[h("p",{class:"intro",text:t.sous})]);
 app.appendChild(s);
 var ps=h("section",{class:"sec"},[top(t.pieces),h("p",{class:"s",text:t.piecesAide})]);
 PIECES.forEach(function(p){ps.appendChild(pieceBox(p[0]));});
 app.appendChild(ps);
 var done=0,right=0;
 CLAUSES.forEach(function(c,ci){
  var sec=h("section",{class:"sec"},[top(c.n)]);
  c.parts.forEach(function(p,pi){
   var key=ci+"."+pi,got=answers[key];
   var box=h("div",{class:"part"+(got?" done":"")},[h("p",{class:"cl",text:"« "+p.t+" »"})]);
   var row=h("div",{class:"letters"});
   ["O","R","I","X"].forEach(function(L){
    row.appendChild(h("button",{class:L==="X"?"x":"","aria-pressed":String(got===L),"aria-label":L,on:{click:function(){answers[key]=L;render();}}},[L]));});
   box.appendChild(row);
   if(got){
    done++;var ok=p.ok.indexOf(got)===0,def=p.ok.indexOf(got)>0;if(ok||def)right++;
    box.appendChild(h("p",{class:"verdict "+((ok||def)?"ok":"no"),text:(ok?"✓ "+t.juste:def?"✓ "+t.presque:"— "+t.faux+" "+p.ok[0])}));
    box.appendChild(h("p",{class:"why",text:p[lang]}));
    box.appendChild(h("p",{class:"s",text:p.src.length?t.porte+" "+p.src.join(", "):t.aucune}));
    p.src.forEach(function(id){box.appendChild(pieceBox(id));});
   }
   sec.appendChild(box);
  });
  app.appendChild(sec);
 });
 var fin=h("section",{class:"sec"},[top(t.score),h("p",{class:"score"},[String(right),h("span",{text:" / 5"})]),h("p",{class:"s",text:t.sur}),h("p",{class:"why",text:t.fin}),
  h("button",{class:"lnk",text:t.rejouer,on:{click:function(){answers={};render();window.scrollTo(0,0);}}}),
  h("a",{class:"lnk",href:"../journal/#carte",text:t.carte+" →"}),
  h("a",{class:"lnk",href:"../",text:t.retour})]);
 app.appendChild(fin);
}
applyTheme();render();
document.getElementById("lang").onclick=function(){lang=lang==="fr"?"en":"fr";try{localStorage.setItem("judging-ai-journal-lang",lang);}catch(e){}render();};
document.getElementById("theme").onclick=function(){var dark=theme?theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;theme=dark?"light":"dark";applyTheme();try{localStorage.setItem("judging-ai-journal-theme",theme);}catch(e){}};
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("../sw.js").catch(function(){});
})();
</script>
