<style>
/* Judging AI · identité commune : les composants du mur, en sombre et en clair. */

:root{
  --fond:#ffffff; --encre:#111111; --encre2:#333333; --sourd:#666666; --trait:#dddddd;
  --orange:#c8623f; --sur-orange:#ffffff; --boite:#f4f3f0;
  --serif:Georgia,'Times New Roman',serif;
  --mono:'SF Mono',Menlo,ui-monospace,Consolas,monospace;
  --sans:-apple-system,system-ui,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--fond:#08090b;--encre:#e8e6e1;--encre2:#cfcac2;--sourd:#8b8f98;--trait:#23272e;--orange:#d97757;--sur-orange:#1a1409;--boite:#101216;color-scheme:dark}
}
:root[data-theme="dark"]{--fond:#08090b;--encre:#e8e6e1;--encre2:#cfcac2;--sourd:#8b8f98;--trait:#23272e;--orange:#d97757;--sur-orange:#1a1409;--boite:#101216;color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0;background:var(--fond);color:var(--encre);font:400 17px/1.5 var(--sans)}

/* l'en-tête d'une page : étiquette mono à gauche, boîte O·R·I·X à droite, filet orange */
.top{position:relative;height:2px;background:var(--orange);margin-top:2.6em}
.top .k{position:absolute;left:0;top:-2.0em;color:var(--sourd);font:500 15px/1 var(--mono);letter-spacing:.08em;padding:.5em 0}
.top .tag{position:absolute;right:0;top:-2.05em;background:var(--orange);color:var(--sur-orange);font:700 14px/1 var(--serif);letter-spacing:.28em;padding:.55em .8em .55em 1em;white-space:nowrap}

/* les voix */
.big{font:400 clamp(30px,8vw,56px)/1.15 var(--serif);margin:0}
.med{font:400 clamp(22px,5.4vw,34px)/1.3 var(--serif);margin:0}
.l{font:400 clamp(17px,4.2vw,22px)/1.45 var(--sans);margin:0;color:var(--encre)}
.q{font:italic 400 clamp(20px,5vw,30px)/1.3 var(--serif);margin:0}
.s{font:400 14px/1.4 var(--sans);color:var(--sourd);margin:0}
.m{font:400 14px/1.5 var(--mono);margin:0;padding:.35em .7em;border-left:2px solid var(--orange);background:var(--boite);white-space:pre-wrap;word-break:break-word}

/* une ligne : la lettre en mono orange, le texte */
.ln{display:grid;grid-template-columns:1.6em 1fr;gap:.7em;margin:0 0 .6em;word-break:break-word}
.ln .meta{color:var(--orange);font:500 14px/1.9 var(--mono)}
.ln .txt{font:400 clamp(17px,4.2vw,22px)/1.45 var(--sans)}
.ln .txt b{font-weight:700}

/* la lettre dans le texte */
.chip{display:inline-block;min-width:1.55em;text-align:center;font:600 .95em/1.5 var(--serif);border:2px solid var(--encre);border-radius:6px;padding:0 .3em;vertical-align:baseline}
.chip.x{border-color:var(--orange);color:var(--orange)}

hr.r{border:0;border-top:1px solid var(--trait);margin:.6em 0;width:100%}
.draw{width:min(46vw,220px);height:auto}
.help{color:var(--sourd);font:400 12px/1.5 var(--mono);opacity:.7}

.hd{max-width:1000px;margin:0 auto;padding:10px max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));display:flex;gap:14px;align-items:center;font:500 14px/1 var(--mono);letter-spacing:.08em;color:var(--sourd)}
.hd .sp{flex:1}
.hd .lg b{color:var(--encre);font-weight:600}
.hd button,.hd a{background:none;border:0;color:var(--sourd);font:inherit;letter-spacing:inherit;min-height:40px;padding:0 2px;text-decoration:none}
main{max-width:1000px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-right,0px)) 70px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:.9em}
.sec{display:flex;flex-direction:column;gap:.8em;padding-top:1.6em}
.intro{font:400 clamp(17px,4.2vw,20px)/1.5 var(--sans);color:var(--encre2);margin:0;max-width:74ch}
.mast{font:400 clamp(30px,8vw,54px)/1.1 var(--serif);margin:0;max-width:17ch}
.mastsub{font:500 13px/1.5 var(--mono);color:var(--sourd);margin:0;letter-spacing:.04em}
.act{display:inline-block;background:var(--orange);color:var(--sur-orange);text-decoration:none;font:700 16px/52px var(--serif);letter-spacing:.14em;padding:0 1.3em;align-self:flex-start;min-height:52px}
.act.open{background:var(--encre);color:var(--fond)}
.lnk{align-self:flex-start;color:var(--encre);font:500 17px/1.5 var(--sans);text-decoration:underline;text-decoration-color:var(--orange);text-decoration-thickness:2px;text-underline-offset:5px;padding:.4em 0}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--trait);border-bottom:1px solid var(--trait)}
.facts div{padding:.8em .8em .8em 0}
.facts b{display:block;font:400 clamp(25px,6vw,36px)/1 var(--serif)}
.facts span{display:block;margin-top:.35em;font:500 11px/1.35 var(--mono);letter-spacing:.05em;color:var(--sourd)}
.preview{width:100%;height:min(72vh,860px);min-height:520px;border:0;border-top:2px solid var(--orange);background:#fff}
.notice{border-left:2px solid var(--orange);background:var(--boite);padding:.8em 1em;margin:0;font:400 14px/1.5 var(--sans);color:var(--encre2)}
@media(max-width:600px){.facts{grid-template-columns:1fr}.facts div{border-bottom:1px solid var(--trait)}.facts div:last-child{border-bottom:0}.preview{height:68vh;min-height:480px}}
[hidden]{display:none!important}.session-nav{display:flex;gap:10px;flex-wrap:wrap;padding:12px 0}.session-nav button{font:600 18px/1.3 var(--sans);min-height:50px;padding:10px 16px;background:var(--fond);color:var(--encre);border:1px solid var(--trait);cursor:pointer}.session-nav button[aria-pressed=true]{background:var(--orange);color:var(--sur-orange)}.session-frame{width:100%;height:calc(100dvh - 145px);min-height:420px;border:0;background:#08090a}#resource-select{width:100%;min-height:52px;font:500 19px/1.4 var(--sans);background:var(--fond);color:var(--encre);padding:10px;margin:10px 0}main:has(.session-frame){padding-bottom:12px}
