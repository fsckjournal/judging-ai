<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Judging AI">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" href="../icon-192.png">
<title>Judging AI · Skill du prof</title>
<link rel="stylesheet" href="../ds.css">
</head>
<body class="ja">
<header class="ja-bande"><div class="ja-page">
<div class="ja-tete"><span class="ja-mot"><a href="../">judging ai</a><i id="sous"></i></span><span class="outils"><button type="button" id="lang" class="ja-langue"><b>fr</b> · en</button><button type="button" id="theme">◐</button><button type="button" id="paire"></button></span></div>
<nav class="ja-pas" id="etapes"><a class="nom" id="vers-c" href="../skill/#c"></a></nav>
<h1 class="ja-question" id="titre"></h1>
</div></header>
<main class="ja-page ja-ecran" id="app"></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="../commun.js"></script>
<script>
(function(){
"use strict";
/* Juger l'IA · prof/ : Skill du prof (condition C), lue dans prof/SKILL.md à chaque ouverture (jamais en cache : voir sw.js).
   Le texte en entier, en lecture seule, et un seul bouton « copier ». Sans fichier : une ligne. */
var h=JA.h, lang=JA.lang(), texte=null;
var T={
 fr:{titre:"Skill du prof",sous:"condition C",absente:"Skill du prof : ici après la pause.",copier:"copier",copie:"Copié",
  banc:"← C · Skill du prof",langL:"langue",themeL:"thème",version:"version"},
 en:{titre:"The teacher's Skill",sous:"condition C",absente:"The teacher's Skill will be here after the break.",copier:"copy",copie:"Copied",
  banc:"← C · the teacher's Skill",langL:"language",themeL:"theme",version:"version"}
};
function t(k){return T[lang][k];}
function toast(s){var e=document.getElementById("toast");e.textContent=s;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove("on");},2400);}
function copier(s){function fb(){var x=h("textarea",{style:"position:fixed;top:0;opacity:0"});x.value=s;document.body.appendChild(x);x.select();try{document.execCommand("copy");toast(t("copie"));}catch(e){}x.remove();}if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(s).then(function(){toast(t("copie"));},fb);else fb();}
function render(){
  document.documentElement.lang=lang;
  var lb=document.getElementById("lang");lb.innerHTML=lang==="fr"?"<b>fr</b> · en":"fr · <b>en</b>";lb.setAttribute("aria-label",t("langL")+" : "+lang);
  document.getElementById("theme").setAttribute("aria-label",t("themeL"));
  document.getElementById("sous").textContent=t("sous");
  document.getElementById("titre").textContent=t("titre");
  document.getElementById("vers-c").textContent=t("banc");
  var app=document.getElementById("app");app.innerHTML="";
  if(texte===null)return;
  if(!texte.trim())app.appendChild(h("p",{class:"ja-consigne",id:"prof-absente",style:"margin:0",text:t("absente")}));
  else{
    app.appendChild(h("div",{class:"ja-suite",style:"margin:0 0 28px"},[h("button",{type:"button",class:"ja-btn",id:"prof-copier",text:t("copier"),on:{click:function(){copier(texte);}}})]));
    app.appendChild(h("section",{class:"ja-section",style:"margin-top:0"},[h("pre",{class:"m",id:"prof-texte",text:texte})]));
  }
  app.appendChild(h("p",{class:"ja-etat ja-version-app",id:"ja-version",text:"judging ai · "+t("version")+" "+JA.VERSION}));
}
document.getElementById("lang").onclick=function(){lang=lang==="fr"?"en":"fr";try{localStorage.setItem("judging-ai-journal-lang",lang);}catch(e){}render();};
var theme="";try{theme=localStorage.getItem("judging-ai-journal-theme")||"";}catch(e){}
function applyTheme(){if(theme)document.documentElement.setAttribute("data-theme",theme);else document.documentElement.removeAttribute("data-theme");}applyTheme();
document.getElementById("theme").onclick=function(){var dark=theme?theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;theme=dark?"light":"dark";applyTheme();try{localStorage.setItem("judging-ai-journal-theme",theme);}catch(e){}};
render();
fetch("SKILL.md",{cache:"no-store"}).then(function(r){return r.ok?r.text():"";}).catch(function(){return "";}).then(function(s){texte=s;render();});
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("../sw.js").catch(function(){});
})();
</script>
</body>
</html>
