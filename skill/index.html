/* ---------- comparaison ligne à ligne ---------- */
function lignes(a,b){
  var A=a.split("\n"),Bb=b.split("\n"),n=A.length,m=Bb.length,L=[],i,j;
  for(i=0;i<=n;i++){L.push(new Uint16Array(m+1));}
  for(i=n-1;i>=0;i--)for(j=m-1;j>=0;j--)L[i][j]=A[i]===Bb[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  var ops=[];i=0;j=0;
  while(i<n&&j<m){if(A[i]===Bb[j]){ops.push(["=",A[i],Bb[j]]);i++;j++;}else if(L[i+1][j]>=L[i][j+1]){ops.push(["-",A[i]]);i++;}else{ops.push(["+",Bb[j]]);j++;}}
  while(i<n)ops.push(["-",A[i++]]);while(j<m)ops.push(["+",Bb[j++]]);
  var rows=[],k=0;
  while(k<ops.length){
    if(ops[k][0]==="="){rows.push([ops[k][1],"eq",ops[k][2],"eq"]);k++;continue;}
    var del=[],add=[];while(k<ops.length&&ops[k][0]!=="="){(ops[k][0]==="-"?del:add).push(ops[k][1]);k++;}
    for(var x=0;x<Math.max(del.length,add.length);x++)rows.push([x<del.length?del[x]:"",x<del.length?"moins":"vide",x<add.length?add[x]:"",x<add.length?"plus":"vide"]);
  }
  return {rows:rows,moins:ops.filter(function(o){return o[0]==="-";}).length,plus:ops.filter(function(o){return o[0]==="+";}).length};
}
function vueDiff(box){
  box.innerHTML="";var ta=textes();
  var a=B.cmpA,b=B.cmpB;
  if(!ta.some(function(o){return o.v===a;}))a=ta.length>2?ta[ta.length-2].v:ta[ta.length-1].v;
  if(!ta.some(function(o){return o.v===b;}))b=ta.length>1?"b":ta[0].v;
  var la=ta.filter(function(o){return o.v===a;})[0].l,lb=ta.filter(function(o){return o.v===b;})[0].l;
  var d=lignes(texteDe(a).md,texteDe(b).md);
  box.appendChild(h("p",{class:"ja-etat",style:"margin-top:24px",text:d.moins||d.plus?r(t("retire"),{n:d.moins})+" · "+r(t("ajoute"),{n:d.plus}):t("identiques")}));
  var g=h("div",{class:"ja-diff",id:"diff"},[h("div",{class:"en",text:la}),h("div",{class:"en",text:lb})]);
  var rows=d.rows,i=0;
  while(i<rows.length){
    var j=i;while(j<rows.length&&rows[j][1]==="eq")j++;
    var run=j-i,keepA=i===0?0:3,keepB=j===rows.length?0:3;
    if(run>keepA+keepB+1){
      rows.slice(i,i+keepA).concat([["…",""]]).concat(rows.slice(j-keepB,j)).forEach(function(x){
        if(x[0]==="…"&&x.length===2){g.appendChild(h("div",{class:"c saut",text:r(t("pareil"),{n:run-keepA-keepB})}));g.appendChild(h("div",{class:"c saut",text:""}));}
        else{g.appendChild(h("div",{class:"c eq",text:x[0]}));g.appendChild(h("div",{class:"c eq",text:x[2]}));}});
      i=j;continue;
    }
    var x=rows[i];g.appendChild(h("div",{class:"c "+x[1],text:x[0]}));g.appendChild(h("div",{class:"c "+x[3],text:x[2]}));i++;
  }
  box.appendChild(g);
}

    h("button",{type:"button",class:"ja-lien",id:"ex-md",text:t("md"),on:{click:function(){var x=pret();if(x)JA.telecharger(x.md,"SKILL.md","text/markdown");}}}),

  s.appendChild(h("div",{class:"ja-colonnes"},t("aide").map(function(a){return h("div",null,[h("h2",{text:a[0]}),h("p",{class:"ja-lab",text:a[1]}),h("ol",null,a[2].map(function(x){return h("li",{text:x});}))]);})));
  box.appendChild(s);
}

/* ---------- écran : le dossier (les critères, l'export et l'import, tous les essais) ---------- */
function vueDossier(tete,box){
  titre(tete,cap(lang==="fr"?"le dossier · 40 %":"the dossier · 40 %"));
  var s=h("section");
  s.appendChild(h("div",{id:"dossier"},[JA.criteres(D)]));
  s.appendChild(JA.outils());
  var hs=h("div",{class:"ja-section",id:"essais"},[h("h2",{class:"ja-sous",text:cap(t("tous"))})]);
  if(!D.essais.length)hs.appendChild(h("p",{class:"ja-etat",text:t("aucunE")}));
  var li=h("div",{class:"ja-essais"});
  D.essais.map(function(e,i){return [e,i];}).reverse().forEach(function(p){
    var e=p[0],i=p[1];
    var titreE=t("essai")+" "+(i+1)+(e.condition?" · "+JA.condLabel(e.condition):" · "+t("sansAvec"))+(!e.condition||e.condition==="D"?" · v"+e.version:"")+" · "+e.app+(e.modele?" · "+e.modele:"");
    var corps=e.condition?[h("div",{class:"champ"},[h("b",{text:t("reponse")}),liens(h("pre",{class:"m"}),e.reponse)]),h("p",{class:"ja-etat",text:JA.score(e)+"/"+JA.sur(e)+(e.note_par?" · "+JA.banc().notePar+" : "+e.note_par:"")})]
      :[h("div",{class:"champ"},[h("b",{text:t("sans")}),h("pre",{class:"m",text:e.sans})]),h("div",{class:"champ"},[h("b",{text:t("avec")}),h("pre",{class:"m",text:e.avec})])];
    li.appendChild(h("details",{class:"essai"},[h("summary",{text:titreE}),h("p",{class:"sub",text:[e.date,e.question].join(" · ")})].concat(corps).concat([
      h("div",{class:"champ"},[h("b",{text:t("gagne")}),h("span",{class:"voix",text:e.gagne||"—"})]),h("div",{class:"champ"},[h("b",{text:t("perdu")}),h("span",{class:"voix",text:e.perdu||"—"})]),h("div",{class:"champ"},[h("b",{text:t("decision")}),h("span",{class:"voix",text:e.decision||"—"})]),
      h("div",{class:"ja-suite droite",style:"margin-top:16px"},[h("button",{type:"button",class:"ja-lien",text:t("suppr"),on:{click:function(){confirmer(t("supprQ"),t("suppr"),function(){D.essais.splice(i,1);save();render();});}}})])])));
  });
  if(D.essais.length)hs.appendChild(li);
  s.appendChild(hs);box.appendChild(s);
}

/* ---------- rendu ---------- */
function render(){
  document.documentElement.lang=lang;var lb=document.getElementById("lang");lb.innerHTML=lang==="fr"?"<b>fr</b> · en":"fr · <b>en</b>";lb.setAttribute("aria-label",t("langL")+" : "+lang);document.getElementById("theme").setAttribute("aria-label",t("themeL"));
  document.getElementById("etapes").setAttribute("aria-label",t("etapes"));
  var v=route(),box=document.getElementById("app"),tete=document.getElementById("tete");box.innerHTML="";tete.innerHTML="";
  if(BANC.indexOf(v)>=0||v==="b")dernier=v;
  if(v==="question")vueQuestion(tete,box);
  else if(v==="a"||v==="c"||v==="d"||v==="b")vueCond(tete,box,v.toUpperCase());
  else if(v==="trois")vueTrois(tete,box);
  else if(v==="ecrire")vueEcrire(tete,box);
  else if(v==="versions")vueVersions(tete,box);
  else if(v==="charger")vueCharger(tete,box);
  else vueDossier(tete,box);
  pas();qui();
}
